[project]
name = "spec-workbench"
version = "0.1.0"
description = "Living spec documents: render app specs with margin threads, suggestions, and statuses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "markdown-it-py>=3.0",
    "werkzeug>=3.0",
]

[project.scripts]
spec-workbench = "spec_workbench.runner:main"
open-spec = "spec_workbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_workbench"]
